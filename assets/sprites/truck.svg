<svg xmlns="http://www.w3.org/2000/svg" width="950" height="370" viewBox="0 -370 950 370">
  <!-- SPAN box truck. 1 unit = 1 cm, origin rear bumper on ground, facing right.
       Wheels at x = 150 / 290 (tandem) / 790 (steer), r = 52. -->
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb1f2"/><stop offset="0.4" stop-color="#2f7fd0"/><stop offset="0.85" stop-color="#1f5d9e"/><stop offset="1" stop-color="#143f6d"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e9edf1"/><stop offset="1" stop-color="#b8c1ca"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d9f1ff"/><stop offset="0.45" stop-color="#6ea3cc"/><stop offset="1" stop-color="#2a4664"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/><stop offset="0.4" stop-color="#b9c2cc"/><stop offset="0.6" stop-color="#8d97a3"/><stop offset="1" stop-color="#dfe5eb"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8792"/><stop offset="0.4" stop-color="#f4f7fa"/><stop offset="1" stop-color="#6d7680"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd76a"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#b3121a"/></linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a505b"/><stop offset="1" stop-color="#1e2228"/></linearGradient>
    <path id="cabShape" d="M668 -40 L668 -330 Q670 -350 692 -350 L860 -350 Q884 -348 892 -326 L930 -204 L942 -196 Q948 -190 948 -172 L948 -62 Q948 -40 928 -40 L848.8 -40 A60 60 0 1 0 731.2 -40 Z"/>
    <clipPath id="cabClip"><use href="#cabShape"/></clipPath>
    <clipPath id="boxClip"><rect x="6" y="-356" width="654" height="234" rx="8"/></clipPath>
  </defs>
  <!-- chassis -->
  <rect x="0" y="-126" width="910" height="28" rx="4" fill="url(#trim)"/>
  <path d="M86 -112 A64 64 0 0 1 214 -112 Z M226 -112 A64 64 0 0 1 354 -112 Z" fill="#121418"/>
  <rect x="80" y="-132" width="282" height="14" rx="5" fill="#2a2f37" stroke="#1c2230" stroke-width="2"/>
  <rect x="4" y="-100" width="40" height="22" rx="4" fill="#3a3f48" stroke="#1c2230" stroke-width="2"/>
  <rect x="356" y="-110" width="12" height="60" rx="3" fill="#1c2230"/>
  <!-- fuel tank -->
  <rect x="470" y="-116" width="130" height="50" rx="14" fill="url(#chrome)" stroke="#1c2230" stroke-width="2.5"/>
  <path d="M500 -116 V-66 M570 -116 V-66" stroke="#6d7680" stroke-width="3"/>
  <!-- cargo box -->
  <rect x="6" y="-356" width="654" height="234" rx="8" fill="url(#box)"/>
  <g clip-path="url(#boxClip)">
    <path d="M66 -356 V-122 M126 -356 V-122 M186 -356 V-122 M246 -356 V-122 M306 -356 V-122 M366 -356 V-122 M426 -356 V-122 M486 -356 V-122 M546 -356 V-122 M606 -356 V-122" stroke="#aeb8c2" stroke-width="2" opacity="0.7"/>
    <rect x="0" y="-180" width="670" height="22" fill="#f28c28"/>
    <rect x="0" y="-158" width="670" height="8" fill="#2f7fd0"/>
    <rect x="0" y="-356" width="670" height="14" fill="#ffffff" opacity="0.8"/>
    <rect x="0" y="-140" width="670" height="18" fill="#000" opacity="0.12"/>
  </g>
  <!-- logo -->
  <g transform="translate(250 -290)">
    <path d="M0 40 Q80 -24 160 40" fill="none" stroke="#2f7fd0" stroke-width="12" stroke-linecap="round"/>
    <path d="M-8 44 H168" stroke="#22324a" stroke-width="10" stroke-linecap="round"/>
    <path d="M40 44 V16 M80 44 V8 M120 44 V16" stroke="#22324a" stroke-width="6"/>
    <rect x="20" y="58" width="120" height="10" rx="5" fill="#22324a" opacity="0.5"/>
  </g>
  <rect x="6" y="-356" width="654" height="234" rx="8" fill="none" stroke="#1c2230" stroke-width="3.5"/>
  <!-- rear lights / markers -->
  <rect x="8" y="-162" width="12" height="30" rx="3" fill="url(#tail)" stroke="#1c2230" stroke-width="2"/>
  <g fill="#ffa53a" stroke="#1c2230" stroke-width="1.5"><circle cx="110" cy="-130" r="5"/><circle cx="260" cy="-130" r="5"/><circle cx="410" cy="-130" r="5"/><circle cx="560" cy="-130" r="5"/></g>
  <!-- exhaust stack -->
  <rect x="648" y="-366" width="14" height="240" rx="5" fill="url(#pipe)" stroke="#1c2230" stroke-width="2"/>
  <!-- cab -->
  <path d="M848.8 -40 A60 60 0 1 0 731.2 -40 Z" fill="#121418"/>
  <use href="#cabShape" fill="url(#cab)"/>
  <g clip-path="url(#cabClip)">
    <rect x="660" y="-80" width="300" height="40" fill="#000" opacity="0.2"/>
    <rect x="660" y="-176" width="300" height="10" fill="#ffffff" opacity="0.85"/>
    <path d="M668 -330 Q670 -350 692 -350 L860 -350 L856 -340 L690 -340 Z" fill="#fff" opacity="0.3"/>
  </g>
  <path d="M800 -334 L862 -334 Q874 -334 878 -322 L912 -212 L800 -212 Z" fill="url(#glass)" stroke="#1c2230" stroke-width="3" stroke-linejoin="round"/>
  <path d="M820 -332 L842 -332 L822 -216 L806 -216 Z" fill="#fff" opacity="0.26"/>
  <path d="M700 -338 L700 -124 L880 -124 M790 -338 V-212" fill="none" stroke="#143f6d" stroke-width="3" opacity="0.8"/>
  <rect x="714" y="-232" width="30" height="7" rx="3" fill="#143f6d"/>
  <rect x="704" y="-110" width="48" height="10" rx="3" fill="#2a2f37" stroke="#1c2230" stroke-width="2"/>
  <!-- grille / lights / bumper -->
  <path d="M938 -184 H948 M936 -170 H948 M936 -156 H948 M936 -142 H948 M936 -128 H948" stroke="#1c2230" stroke-width="4"/>
  <rect x="924" y="-114" width="24" height="26" rx="5" fill="url(#head)" stroke="#1c2230" stroke-width="2.5"/>
  <rect x="898" y="-72" width="52" height="32" rx="8" fill="url(#trim)"/>
  <!-- mirror -->
  <path d="M900 -300 Q930 -300 932 -256" fill="none" stroke="#1c2230" stroke-width="5" stroke-linecap="round"/>
  <rect x="924" y="-272" width="14" height="34" rx="4" fill="#2a2f37"/>
  <use href="#cabShape" fill="none" stroke="#1c2230" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
