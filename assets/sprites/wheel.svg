<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="-50 -50 100 100">
  <!-- SPAN light vehicle wheel. Centre at (0,0), diameter 100 units = tyre outer diameter. -->
  <defs>
    <radialGradient id="tyre" cx="0" cy="0" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#3a3f47"/><stop offset="0.8" stop-color="#22252a"/><stop offset="1" stop-color="#121418"/>
    </radialGradient>
    <radialGradient id="rim" cx="-10" cy="-12" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cdd5de"/><stop offset="1" stop-color="#7d8894"/>
    </radialGradient>
    <radialGradient id="hub" cx="-3" cy="-3" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8d97a3"/>
    </radialGradient>
  </defs>
  <circle r="49" fill="url(#tyre)" stroke="#0b0c0e" stroke-width="2"/>
  <!-- tread blocks -->
  <circle r="46" fill="none" stroke="#0e1013" stroke-width="5" stroke-dasharray="7 5.04"/>
  <circle r="40" fill="none" stroke="#4b515a" stroke-width="1.5" opacity="0.7"/>
  <!-- rim -->
  <circle r="31" fill="#2a2f36"/>
  <circle r="29" fill="url(#rim)"/>
  <!-- five spokes (cut-outs) -->
  <g fill="#2a2f36">
    <path d="M-5 -10 L-9 -25 Q0 -28 9 -25 L5 -10 Z"/>
    <path d="M-5 -10 L-9 -25 Q0 -28 9 -25 L5 -10 Z" transform="rotate(72)"/>
    <path d="M-5 -10 L-9 -25 Q0 -28 9 -25 L5 -10 Z" transform="rotate(144)"/>
    <path d="M-5 -10 L-9 -25 Q0 -28 9 -25 L5 -10 Z" transform="rotate(216)"/>
    <path d="M-5 -10 L-9 -25 Q0 -28 9 -25 L5 -10 Z" transform="rotate(288)"/>
  </g>
  <circle r="29" fill="none" stroke="#e9eef3" stroke-width="2" opacity="0.8"/>
  <circle r="10" fill="url(#hub)" stroke="#2a2f36" stroke-width="2"/>
  <g fill="#3a3f47"><circle cx="0" cy="-6" r="1.8"/><circle cx="5.7" cy="-1.9" r="1.8"/><circle cx="3.5" cy="4.9" r="1.8"/><circle cx="-3.5" cy="4.9" r="1.8"/><circle cx="-5.7" cy="-1.9" r="1.8"/></g>
  <circle r="3" fill="#d8342b"/>
  <!-- specular -->
  <path d="M-34 -22 A40 40 0 0 1 -12 -40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.18" stroke-linecap="round"/>
</svg>
