<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="-50 -50 100 100">
  <!-- SPAN heavy vehicle wheel (bus / truck / semi / tanker / crane). Centre at (0,0), diameter 100 = tyre outer diameter. -->
  <defs>
    <radialGradient id="tyre" cx="0" cy="0" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#3a3f47"/><stop offset="0.82" stop-color="#22252a"/><stop offset="1" stop-color="#101215"/>
    </radialGradient>
    <radialGradient id="rim" cx="-8" cy="-10" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2f5f8"/><stop offset="0.5" stop-color="#aeb8c3"/><stop offset="1" stop-color="#5f6a76"/>
    </radialGradient>
    <radialGradient id="dome" cx="-3" cy="-4" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#c3ccd6"/><stop offset="1" stop-color="#6d7883"/>
    </radialGradient>
  </defs>
  <circle r="49" fill="url(#tyre)" stroke="#0b0c0e" stroke-width="2"/>
  <!-- chunky lugs -->
  <circle r="45.5" fill="none" stroke="#0d0f12" stroke-width="7" stroke-dasharray="9.5 4.79"/>
  <circle r="38" fill="none" stroke="#4b515a" stroke-width="1.5" opacity="0.6"/>
  <!-- steel rim -->
  <circle r="33" fill="#262a30"/>
  <circle r="31" fill="url(#rim)"/>
  <circle r="24" fill="none" stroke="#5f6a76" stroke-width="2"/>
  <!-- ventilation holes -->
  <g fill="#1c2026">
    <ellipse cx="0" cy="-27" rx="4.2" ry="2.6"/><ellipse cx="0" cy="-27" rx="4.2" ry="2.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="-27" rx="4.2" ry="2.6" transform="rotate(120)"/><ellipse cx="0" cy="-27" rx="4.2" ry="2.6" transform="rotate(180)"/>
    <ellipse cx="0" cy="-27" rx="4.2" ry="2.6" transform="rotate(240)"/><ellipse cx="0" cy="-27" rx="4.2" ry="2.6" transform="rotate(300)"/>
  </g>
  <!-- hub + 10 lug nuts -->
  <circle r="17" fill="#3a3f47" stroke="#1c2026" stroke-width="2"/>
  <g fill="#d9dfe5" stroke="#1c2026" stroke-width="1">
    <circle cx="0" cy="-13" r="2.4"/><circle cx="7.64" cy="-10.52" r="2.4"/><circle cx="12.36" cy="-4.02" r="2.4"/><circle cx="12.36" cy="4.02" r="2.4"/><circle cx="7.64" cy="10.52" r="2.4"/>
    <circle cx="0" cy="13" r="2.4"/><circle cx="-7.64" cy="10.52" r="2.4"/><circle cx="-12.36" cy="4.02" r="2.4"/><circle cx="-12.36" cy="-4.02" r="2.4"/><circle cx="-7.64" cy="-10.52" r="2.4"/>
  </g>
  <circle r="8" fill="url(#dome)" stroke="#1c2026" stroke-width="1.5"/>
  <rect x="-1.5" y="-8" width="3" height="5" fill="#f2b51d"/>
  <path d="M-34 -24 A42 42 0 0 1 -12 -42" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.16" stroke-linecap="round"/>
</svg>
