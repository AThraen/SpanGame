<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 -400 1400 400">
  <!-- SPAN boxcar. 1 unit = 1 cm, origin = rear of the car on the rail line, facing right.
       Bogies drawn separately: centres x = 220 / 1180, axles +-90, wheel r 45. Buffers at height 100. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0583a"/><stop offset="0.5" stop-color="#8c3b26"/><stop offset="1" stop-color="#5a2416"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2416"/><stop offset="0.5" stop-color="#d06a48"/><stop offset="1" stop-color="#5a2416"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d97a3"/><stop offset="1" stop-color="#3a3f48"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616b"/><stop offset="0.25" stop-color="#2a2f36"/><stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/><stop offset="0.45" stop-color="#b9c2cc"/><stop offset="0.6" stop-color="#8d97a3"/><stop offset="1" stop-color="#dfe5eb"/>
    </linearGradient>
    <clipPath id="clip"><rect x="30" y="-388" width="1340" height="250" rx="6"/></clipPath>
  </defs>
  <g stroke="#1c2230">
    <rect x="12" y="-111" width="24" height="22" rx="3" fill="url(#black)" stroke-width="2"/>
    <rect x="1" y="-125" width="13" height="50" rx="5" fill="url(#chrome)" stroke-width="2.5"/>
    <rect x="1364" y="-111" width="24" height="22" rx="3" fill="url(#black)" stroke-width="2"/>
    <rect x="1386" y="-125" width="13" height="50" rx="5" fill="url(#chrome)" stroke-width="2.5"/>
  </g>
  <rect x="24" y="-146" width="1352" height="32" rx="3" fill="url(#black)" stroke="#1c2230" stroke-width="3"/>
  <path d="M440 -114 L520 -100 L880 -100 L960 -114" fill="none" stroke="#1c2230" stroke-width="6"/>
  <rect x="640" y="-112" width="120" height="22" rx="4" fill="#262a30" stroke="#1c2230" stroke-width="2"/>
  <!-- roof -->
  <path d="M26 -386 Q40 -398 80 -398 L1320 -398 Q1360 -398 1374 -386 Z" fill="url(#roof)" stroke="#1c2230" stroke-width="3"/>
  <!-- body -->
  <rect x="30" y="-388" width="1340" height="250" rx="6" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <g fill="url(#rib)" opacity="0.85">
      <rect x="90" y="-388" width="10" height="250"/><rect x="190" y="-388" width="10" height="250"/><rect x="290" y="-388" width="10" height="250"/><rect x="390" y="-388" width="10" height="250"/><rect x="490" y="-388" width="10" height="250"/>
      <rect x="900" y="-388" width="10" height="250"/><rect x="1000" y="-388" width="10" height="250"/><rect x="1100" y="-388" width="10" height="250"/><rect x="1200" y="-388" width="10" height="250"/><rect x="1300" y="-388" width="10" height="250"/>
    </g>
    <rect x="0" y="-388" width="1400" height="12" fill="#ffffff" opacity="0.18"/>
    <rect x="0" y="-160" width="1400" height="22" fill="#000" opacity="0.2"/>
  </g>
  <!-- sliding door -->
  <rect x="556" y="-382" width="288" height="240" rx="4" fill="url(#body)" stroke="#1c2230" stroke-width="3"/>
  <path d="M556 -310 H844 M556 -230 H844" stroke="#5a2416" stroke-width="4"/>
  <path d="M700 -382 V-142" stroke="#5a2416" stroke-width="3" opacity="0.7"/>
  <rect x="540" y="-392" width="320" height="10" rx="3" fill="url(#black)" stroke="#1c2230" stroke-width="2"/>
  <rect x="540" y="-144" width="320" height="8" rx="3" fill="url(#black)" stroke="#1c2230" stroke-width="2"/>
  <rect x="808" y="-280" width="14" height="40" rx="3" fill="url(#chrome)" stroke="#1c2230" stroke-width="2"/>
  <!-- lettering -->
  <g fill="#f4ead0">
    <rect x="130" y="-350" width="160" height="22" rx="4"/><rect x="130" y="-318" width="110" height="12" rx="3"/>
    <rect x="980" y="-340" width="80" height="12" rx="3"/><rect x="980" y="-322" width="120" height="12" rx="3"/><rect x="980" y="-304" width="60" height="12" rx="3"/>
  </g>
  <rect x="1180" y="-200" width="60" height="40" rx="3" fill="#f2b51d" stroke="#1c2230" stroke-width="2"/>
  <!-- ladder -->
  <path d="M1340 -380 V-160 M1356 -380 V-160" stroke="#1c2230" stroke-width="3"/>
  <path d="M1340 -350 H1356 M1340 -320 H1356 M1340 -290 H1356 M1340 -260 H1356 M1340 -230 H1356 M1340 -200 H1356" stroke="#1c2230" stroke-width="3"/>
  <rect x="30" y="-388" width="1340" height="250" rx="6" fill="none" stroke="#1c2230" stroke-width="4"/>
</svg>
