<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="370" viewBox="0 -370 1700 370">
  <!-- SPAN passenger coach (maroon + cream). 1 unit = 1 cm, origin = rear of the car on the rail line,
       facing right. Bogies drawn separately: centres x = 260 / 1440, axles +-110, wheel r 45.
       Buffers at coupler height 100 on both ends. -->
  <defs>
    <linearGradient id="maroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8383f"/><stop offset="0.5" stop-color="#7a2630"/><stop offset="1" stop-color="#4a141b"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/><stop offset="0.7" stop-color="#f1e3c0"/><stop offset="1" stop-color="#d9c79d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/><stop offset="0.5" stop-color="#5a616b"/><stop offset="1" stop-color="#2e333a"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616b"/><stop offset="0.25" stop-color="#2a2f36"/><stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d9f1ff"/><stop offset="0.45" stop-color="#6ea3cc"/><stop offset="1" stop-color="#2a4664"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/><stop offset="0.45" stop-color="#b9c2cc"/><stop offset="0.6" stop-color="#8d97a3"/><stop offset="1" stop-color="#dfe5eb"/>
    </linearGradient>
    <clipPath id="body"><rect x="34" y="-350" width="1632" height="222" rx="12"/></clipPath>
  </defs>
  <!-- buffers -->
  <g stroke="#1c2230">
    <rect x="12" y="-111" width="24" height="22" rx="3" fill="url(#black)" stroke-width="2"/>
    <rect x="1" y="-125" width="13" height="50" rx="5" fill="url(#chrome)" stroke-width="2.5"/>
    <rect x="1664" y="-111" width="24" height="22" rx="3" fill="url(#black)" stroke-width="2"/>
    <rect x="1686" y="-125" width="13" height="50" rx="5" fill="url(#chrome)" stroke-width="2.5"/>
  </g>
  <!-- gangway bellows -->
  <rect x="16" y="-326" width="22" height="190" rx="4" fill="#24282e" stroke="#1c2230" stroke-width="2.5"/>
  <rect x="1662" y="-326" width="22" height="190" rx="4" fill="#24282e" stroke="#1c2230" stroke-width="2.5"/>
  <path d="M20 -306 H34 M20 -282 H34 M20 -258 H34 M20 -234 H34 M20 -210 H34 M20 -186 H34 M20 -162 H34 M1666 -306 H1680 M1666 -282 H1680 M1666 -258 H1680 M1666 -234 H1680 M1666 -210 H1680 M1666 -186 H1680 M1666 -162 H1680" stroke="#3d434b" stroke-width="3"/>
  <!-- underframe + equipment -->
  <rect x="30" y="-134" width="1640" height="28" rx="3" fill="url(#black)" stroke="#1c2230" stroke-width="3"/>
  <g fill="#262a30" stroke="#1c2230" stroke-width="2">
    <rect x="520" y="-108" width="220" height="30" rx="4"/><rect x="900" y="-108" width="140" height="30" rx="4"/><rect x="1100" y="-108" width="120" height="22" rx="4"/>
  </g>
  <path d="M540 -94 H720 M920 -94 H1020" stroke="#4a515b" stroke-width="2.5"/>
  <path d="M440 -106 L500 -96 M1260 -106 L1200 -96" stroke="#1c2230" stroke-width="5"/>
  <!-- roof -->
  <path d="M40 -346 Q60 -368 120 -368 L1580 -368 Q1640 -368 1660 -346 Z" fill="url(#roof)" stroke="#1c2230" stroke-width="3"/>
  <g fill="#3a3f48" stroke="#1c2230" stroke-width="2">
    <rect x="300" y="-376" width="40" height="10" rx="3"/><rect x="640" y="-376" width="40" height="10" rx="3"/><rect x="980" y="-376" width="40" height="10" rx="3"/><rect x="1320" y="-376" width="40" height="10" rx="3"/>
  </g>
  <!-- body -->
  <rect x="34" y="-350" width="1632" height="222" rx="12" fill="url(#maroon)"/>
  <g clip-path="url(#body)">
    <rect x="0" y="-350" width="1700" height="118" fill="url(#cream)"/>
    <rect x="0" y="-232" width="1700" height="5" fill="#d9a441"/>
    <rect x="0" y="-346" width="1700" height="8" fill="#ffffff" opacity="0.5"/>
    <rect x="0" y="-150" width="1700" height="22" fill="#000" opacity="0.2"/>
    <path d="M0 -180 H1700" stroke="#d9a441" stroke-width="2.5" opacity="0.8"/>
  </g>
  <!-- windows -->
  <g fill="url(#glass)" stroke="#1c2230" stroke-width="3">
    <rect x="180" y="-316" width="96" height="74" rx="10"/><rect x="300" y="-316" width="96" height="74" rx="10"/><rect x="420" y="-316" width="96" height="74" rx="10"/>
    <rect x="540" y="-316" width="96" height="74" rx="10"/><rect x="660" y="-316" width="96" height="74" rx="10"/><rect x="780" y="-316" width="96" height="74" rx="10"/>
    <rect x="900" y="-316" width="96" height="74" rx="10"/><rect x="1020" y="-316" width="96" height="74" rx="10"/><rect x="1140" y="-316" width="96" height="74" rx="10"/>
    <rect x="1260" y="-316" width="96" height="74" rx="10"/><rect x="1380" y="-316" width="96" height="74" rx="10"/>
  </g>
  <g fill="#ffffff" opacity="0.25">
    <path d="M196 -312 L226 -312 L206 -246 L188 -246 Z"/><path d="M316 -312 L346 -312 L326 -246 L308 -246 Z"/><path d="M436 -312 L466 -312 L446 -246 L428 -246 Z"/>
    <path d="M556 -312 L586 -312 L566 -246 L548 -246 Z"/><path d="M676 -312 L706 -312 L686 -246 L668 -246 Z"/><path d="M796 -312 L826 -312 L806 -246 L788 -246 Z"/>
    <path d="M916 -312 L946 -312 L926 -246 L908 -246 Z"/><path d="M1036 -312 L1066 -312 L1046 -246 L1028 -246 Z"/><path d="M1156 -312 L1186 -312 L1166 -246 L1148 -246 Z"/>
    <path d="M1276 -312 L1306 -312 L1286 -246 L1268 -246 Z"/><path d="M1396 -312 L1426 -312 L1406 -246 L1388 -246 Z"/>
  </g>
  <!-- passengers -->
  <g fill="#1a2a3c" opacity="0.45">
    <circle cx="226" cy="-270" r="12"/><rect x="211" y="-259" width="30" height="20" rx="10"/>
    <circle cx="470" cy="-272" r="12"/><rect x="455" y="-261" width="30" height="22" rx="10"/>
    <circle cx="590" cy="-268" r="11"/><rect x="576" y="-258" width="28" height="18" rx="9"/>
    <circle cx="950" cy="-271" r="12"/><rect x="935" y="-260" width="30" height="21" rx="10"/>
    <circle cx="1190" cy="-268" r="11"/><rect x="1176" y="-258" width="28" height="18" rx="9"/>
    <circle cx="1430" cy="-272" r="12"/><rect x="1415" y="-261" width="30" height="22" rx="10"/>
  </g>
  <!-- doors -->
  <g fill="none" stroke="#1c2230" stroke-width="3">
    <rect x="64" y="-332" width="80" height="196" rx="6"/><rect x="1556" y="-332" width="80" height="196" rx="6"/>
  </g>
  <g fill="url(#glass)" stroke="#1c2230" stroke-width="2.5">
    <rect x="78" y="-318" width="52" height="58" rx="6"/><rect x="1570" y="-318" width="52" height="58" rx="6"/>
  </g>
  <g fill="url(#chrome)" stroke="#1c2230" stroke-width="1.5"><rect x="124" y="-226" width="14" height="6" rx="2"/><rect x="1562" y="-226" width="14" height="6" rx="2"/></g>
  <path d="M100 -140 V-160 M1600 -140 V-160" stroke="#1c2230" stroke-width="3"/>
  <!-- class / number -->
  <g fill="#d9a441"><rect x="800" y="-210" width="18" height="24" rx="3"/><rect x="826" y="-210" width="40" height="10" rx="3"/><rect x="826" y="-196" width="26" height="10" rx="3"/></g>
  <rect x="34" y="-350" width="1632" height="222" rx="12" fill="none" stroke="#1c2230" stroke-width="4"/>
</svg>
