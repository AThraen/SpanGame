<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" viewBox="-150 -50 300 80">
  <!-- SPAN two-axle bogie side frame. Origin = bogie centre at axle height; axles at x = -100 / +100
       (nominal wheel radius 42). The renderer stretches x to the real axle spacing and y to the wheel size.
       Drawn over the wheels, under the car body. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616b"/><stop offset="0.45" stop-color="#3a3f48"/><stop offset="1" stop-color="#1b1e23"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d3a20"/><stop offset="0.5" stop-color="#d0743a"/><stop offset="1" stop-color="#6d3a20"/>
    </linearGradient>
  </defs>
  <!-- side frame -->
  <path d="M-128 -16 L-118 -30 L-70 -30 L-52 -14 L52 -14 L70 -30 L118 -30 L128 -16 L128 4 L112 12 L-112 12 L-128 4 Z" fill="url(#frame)" stroke="#121418" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-116 -26 L-72 -26 M72 -26 L116 -26" stroke="#8d97a3" stroke-width="2" opacity="0.6"/>
  <!-- bolster window + springs -->
  <rect x="-40" y="-36" width="80" height="34" rx="4" fill="#15181c" stroke="#121418" stroke-width="2"/>
  <g fill="url(#spring)" stroke="#3a1c0c" stroke-width="1.2">
    <rect x="-34" y="-30" width="16" height="24" rx="3"/><rect x="-8" y="-30" width="16" height="24" rx="3"/><rect x="18" y="-30" width="16" height="24" rx="3"/>
  </g>
  <g stroke="#3a1c0c" stroke-width="1.2" opacity="0.8">
    <path d="M-34 -24 H-18 M-34 -18 H-18 M-34 -12 H-18 M-8 -24 H8 M-8 -18 H8 M-8 -12 H8 M18 -24 H34 M18 -18 H34 M18 -12 H34"/>
  </g>
  <rect x="-44" y="-42" width="88" height="10" rx="3" fill="url(#frame)" stroke="#121418" stroke-width="2"/>
  <!-- axle boxes -->
  <g fill="#2a2f36" stroke="#121418" stroke-width="2.5">
    <rect x="-116" y="-14" width="32" height="26" rx="4"/><rect x="84" y="-14" width="32" height="26" rx="4"/>
  </g>
  <g fill="#c9d1da" stroke="#121418" stroke-width="1.5">
    <circle cx="-100" cy="-1" r="7"/><circle cx="100" cy="-1" r="7"/>
  </g>
  <!-- brake hangers / shoes -->
  <g fill="#1b1e23" stroke="#121418" stroke-width="1.5">
    <rect x="-62" y="-10" width="10" height="26" rx="3"/><rect x="52" y="-10" width="10" height="26" rx="3"/>
  </g>
</svg>
