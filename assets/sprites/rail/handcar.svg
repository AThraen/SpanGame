<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 -160 260 160">
  <!-- SPAN handcar (platform + pump stand). 1 unit = 1 cm, origin = rear of the car on the rail line,
       facing right. Axles at x = 50 / 210 (r 30) drawn separately; the pump lever (handcar_lever.svg)
       is drawn by the renderer pivoting at (130, 148) and drives a crank on the front axle. -->
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc186"/><stop offset="0.5" stop-color="#c38c50"/><stop offset="1" stop-color="#7a4a24"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2f36"/><stop offset="0.5" stop-color="#6d7680"/><stop offset="1" stop-color="#2a2f36"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616b"/><stop offset="0.25" stop-color="#2a2f36"/><stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2453a"/><stop offset="1" stop-color="#8a1a14"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd76a"/></linearGradient>
  </defs>
  <!-- pump stand (A-frame) -->
  <path d="M104 -80 L124 -146 L136 -146 L156 -80" fill="none" stroke="#1c2230" stroke-width="10" stroke-linejoin="round"/>
  <path d="M104 -80 L124 -146 L136 -146 L156 -80" fill="none" stroke="url(#iron)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 -110 H146" stroke="#1c2230" stroke-width="5"/>
  <!-- gear box -->
  <rect x="150" y="-104" width="40" height="26" rx="5" fill="url(#black)" stroke="#1c2230" stroke-width="2.5"/>
  <circle cx="170" cy="-91" r="7" fill="#8d97a3" stroke="#1c2230" stroke-width="1.5"/>
  <!-- tool box at the rear -->
  <rect x="14" y="-112" width="62" height="34" rx="3" fill="url(#red)" stroke="#1c2230" stroke-width="2.5"/>
  <path d="M14 -100 H76" stroke="#5a0e0a" stroke-width="2"/>
  <rect x="38" y="-118" width="14" height="8" rx="2" fill="#1c2230"/>
  <!-- deck -->
  <rect x="4" y="-80" width="252" height="18" rx="3" fill="url(#deck)" stroke="#3a2412" stroke-width="2.5"/>
  <path d="M40 -80 V-62 M80 -80 V-62 M120 -80 V-62 M160 -80 V-62 M200 -80 V-62 M236 -80 V-62" stroke="#7a4a24" stroke-width="2" opacity="0.8"/>
  <path d="M8 -76 H252" stroke="#fff3d6" stroke-width="2" opacity="0.5"/>
  <!-- side sill + axle pedestals -->
  <rect x="10" y="-64" width="240" height="10" rx="2" fill="url(#black)" stroke="#1c2230" stroke-width="2"/>
  <g fill="url(#black)" stroke="#1c2230" stroke-width="2"><rect x="40" y="-58" width="20" height="30" rx="3"/><rect x="200" y="-58" width="20" height="30" rx="3"/></g>
  <!-- end beams with buffers / coupler pin -->
  <rect x="0" y="-56" width="10" height="20" rx="3" fill="url(#black)" stroke="#1c2230" stroke-width="2"/>
  <rect x="250" y="-56" width="10" height="20" rx="3" fill="url(#black)" stroke="#1c2230" stroke-width="2"/>
  <!-- lantern at the front -->
  <path d="M238 -80 V-100" stroke="#1c2230" stroke-width="4"/>
  <rect x="234" y="-120" width="22" height="22" rx="4" fill="url(#black)" stroke="#1c2230" stroke-width="2"/>
  <rect x="246" y="-116" width="9" height="14" rx="3" fill="url(#head)" stroke="#1c2230" stroke-width="1.5"/>
  <path d="M238 -120 Q245 -130 252 -120" fill="none" stroke="#1c2230" stroke-width="2.5"/>
</svg>
