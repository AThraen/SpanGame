  <rect width="32" height="32" rx="6" fill="#000000"/>
  <!-- Centred and scaled to fill the plate: the mark's own left margin (5.375
       of the 32-unit box) becomes the margin on every side that its aspect
       ratio allows. 1.52125 takes the 13.97-unit ink box to 21.25 wide, and
       the translate pair moves its centre to the plate's centre, plus 1.6
       units right: the dot pulls the combined ink box's centre right of the u
       itself, so centring the box optically reads as a left-shifted letter.
       1.6 of 32 units is exactly 1 px in a 20 px render. At this size the
       letterform carries its own weight, with nothing thickening it. -->
  <g transform="translate(17.6,16) scale(1.52125) translate(-12.3594,-18.5469)">
