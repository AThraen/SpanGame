<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <meta name="description" content="SPAN — a physics bridge-construction puzzle game.">
  <title>SPAN — Bridge Builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1424'/%3E%3Cpath d='M8 44h48M18 44V16M46 44V16M6 40Q12 39 18 16Q32 46 46 16Q52 39 58 40' stroke='%23ffb547' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <!-- goals: challenge badges -->
  <link rel="stylesheet" href="css/goals.css">
  <link rel="stylesheet" href="css/forces.css"><!-- forces: wind / quake HUD -->
  <!-- daily-challenge: daily / endless panel -->
  <link rel="stylesheet" href="css/daily.css">
  <link rel="stylesheet" href="css/famous.css"><!-- famous: Famous Bridges campaign -->
  <!-- pwa: manifest, app icons, iOS home-screen meta -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/app/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPAN">
  <link rel="stylesheet" href="css/arch-tool.css"><!-- arch-tool: contextual bar -->
  <link rel="stylesheet" href="css/pwa.css">
  <link rel="stylesheet" href="css/history.css"><!-- history: run history, bests, save export -->
  <link rel="stylesheet" href="css/mobile.css"><!-- mobile: responsive touch HUD, loupe, bottom sheet -->
</head>
<body data-screen="boot">
  <canvas id="game-canvas" aria-label="Bridge construction view" data-i18n-aria="core.canvasAria"></canvas>
  <div id="ui"></div>
  <div id="boot" class="boot"><div class="boot-logo">SPAN</div><div class="boot-bar"><span></span></div></div>
  <noscript><div class="noscript">SPAN needs JavaScript to run.</div></noscript>

  <!-- i18n: BG.i18n first (no dependencies), then one dictionary per language and area (docs/I18N.md) -->
  <script src="js/i18n/i18n.js"></script>
  <script src="js/i18n/en/core.js"></script>
  <script src="js/i18n/en/hud.js"></script>
  <script src="js/i18n/en/editor.js"></script>
  <script src="js/i18n/en/results.js"></script>
  <script src="js/i18n/en/levels.js"></script>
  <script src="js/i18n/en/famous.js"></script>
  <script src="js/i18n/en/features.js"></script>
  <script src="js/i18n/en/vehicles.js"></script>
  <script src="js/i18n/en/content.js"></script>
  <script src="js/i18n/da/core.js"></script>
  <script src="js/i18n/da/hud.js"></script>
  <script src="js/i18n/da/editor.js"></script>
  <script src="js/i18n/da/results.js"></script>
  <script src="js/i18n/da/levels.js"></script>
  <script src="js/i18n/da/famous.js"></script>
  <script src="js/i18n/da/features.js"></script>
  <script src="js/i18n/da/vehicles.js"></script>
  <script src="js/i18n/da/content.js"></script>
  <!-- core (browser + node) -->
  <script src="js/core/materials.js"></script>
  <script src="js/core/vehicles.js"></script>
  <script src="js/core/trains.js"></script>
  <script src="js/core/model.js"></script>
  <script src="js/core/physics.js"></script>
  <script src="js/core/events.js"></script><!-- forces: BG.Forces (level.events: wind / quake) -->
  <script src="js/core/levels.js"></script>
  <script src="js/core/templates.js"></script>
  <script src="js/core/curves.js"></script><!-- arch-tool: BG.Curves (curve geometry) -->
  <!-- daily-challenge: procedural level generator -->
  <script src="js/core/generator.js"></script>
  <!-- rendering -->
  <script src="js/render/effects.js"></script>
  <script src="js/render/renderer.js"></script>
  <!-- ui -->
  <script src="js/ui/audio.js"></script>
  <script src="js/ui/storage.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/railinfo.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ui/arch-tool.js"></script><!-- arch-tool: Arch & Curve tool (after main.js: hooks the editor, HUD and game) -->
  <!-- features -->
  <script src="js/features/terrain-fix.js"></script><!-- terrain-fix: waterline build limit overlay -->
  <!-- goals: badges (pure logic, generated data, UI + storage hooks; boot runs on DOMContentLoaded, after these) -->
  <script src="js/features/goals.js"></script>
  <script src="js/features/goals-data.js"></script>
  <script src="js/features/goals-ui.js"></script>
  <script src="js/features/forces-fx.js"></script><!-- forces: visuals, HUD, audio -->
  <!-- daily-challenge: Daily Challenge + Endless mode (wraps BG.Game / BG.Hud / BG.Storage) -->
  <script src="js/features/daily.js"></script>
  <!-- famous: Famous Bridges campaign (extra module; hooks into BG.Game / BG.Hud / BG.Storage before boot) -->
  <script src="js/features/requirements.js"></script>
  <script src="js/features/famous.js"></script>
  <!-- mobile-pwa: always after main.js and every feature script above -->
  <script src="js/features/history.js"></script><!-- history: run history, personal bests, stats, autosave / resume, save export -->
  <script src="js/features/pwa.js"></script><!-- pwa: service worker, install prompt, update toast -->
  <script src="js/features/mobile.js"></script><!-- mobile: touch layer, BG.Mobile, BG.Perf -->
</body>
</html>
