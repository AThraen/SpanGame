# pwa: deploy SPAN to GitHub Pages on every push/merge to main and on release tags (v*).
# Pages must be enabled once in the repo (Settings > Pages > Source: "GitHub Actions").
# Only the shipped game is published (index.html, sw.js, manifest, css/, js/, assets/) - never tools/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # fast, dependency-free sanity checks (the browser tests need Chrome and run locally)
      - name: Physics and level checks
        run: |
          node tools/test-physics.js
          node tools/verify-levels.js

      # refresh the service worker's precache list + version so the deploy always matches its files
      - name: Generate precache
        run: node tools/gen-precache.js

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
